name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format check (clang-format)
        run: nix develop --command cmake -P cmake/lint.cmake

      - name: Spell check (codespell)
        if: always()
        run: nix develop --command cmake -P cmake/spell.cmake

  build-and-test:
    needs: [lint]
    strategy:
      matrix:
        build-type: [Debug, Release]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure
        run: >
          nix develop --command cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -Dpgnlib_DEVELOPER_MODE=ON

      - name: Build
        run: nix develop --command cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: build
        run: nix develop --command ctest --output-on-failure --no-tests=error -j "$(nproc)"
